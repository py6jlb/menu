server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Хешированные ассеты Vite: отсутствующий файл — 404, а не SPA-fallback.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ~* \.(?:js|css|map|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|avif)$ {
        try_files $uri =404;
    }

    # SPA: прямой переход на клиентский маршрут отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
