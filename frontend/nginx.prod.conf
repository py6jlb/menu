server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Service worker, манифест и index.html не кэшируются: новая версия приложения
    # должна подхватываться сразу, а не залипать на старой оболочке.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Хешированные ассеты Vite неизменяемы: отсутствующий файл — 404, а не SPA-fallback.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|css|map|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|avif)$ {
        try_files $uri =404;
    }

    # SPA: прямой переход на клиентский маршрут отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
