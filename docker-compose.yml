services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: menu_planner
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: menu
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu -d menu_planner"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=menu_planner;Username=menu;Password=menu"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data: