services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: menu_planner
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: menu
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu -d menu_planner"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=menu_planner;Username=menu;Password=menu"
      DEPLOYMENT_MODE: "${DEPLOYMENT_MODE:-lab}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8081}"
      JWT_SECRET: "${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789abcdef}"
      JWT_ISSUER: "${JWT_ISSUER:-menu-planner}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-menu-planner-client}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Меню для домохозяек}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
      SMTP_TIMEOUT_SECONDS: "${SMTP_TIMEOUT_SECONDS:-10}"
      EMAIL_TRANSPORT: "${EMAIL_TRANSPORT:-}"
      PHOTOS_DIR: /app/photos
      SHARE_BASE_URL: "${SHARE_BASE_URL:-}"
    volumes:
      - photos_data:/app/photos
    ports:
      - "127.0.0.1:8080:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:80"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  photos_data: