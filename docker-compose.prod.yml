name: menu-planner

services:
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: "${DOMAIN:-:80}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - edge
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-menu_planner}"
      POSTGRES_USER: "${POSTGRES_USER:-menu}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menu} -d ${POSTGRES_DB:-menu_planner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel_logs:/var/log/otel
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

  backend:
    image: "${DOCKERHUB_USER:?DOCKERHUB_USER обязателен}/menu-backend:${IMAGE_TAG:-latest}"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-menu_planner};Username=${POSTGRES_USER:-menu};Password=${POSTGRES_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET обязателен}"
      JWT_ISSUER: "${JWT_ISSUER:-menu-planner}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-menu-planner-client}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Меню для домохозяек}"
      SMTP_ENABLE_STARTTLS: "${SMTP_ENABLE_STARTTLS:-true}"
      PHOTOS_DIR: /app/photos
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    volumes:
      - photos_data:/app/photos
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - edge
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  frontend:
    image: "${DOCKERHUB_USER:?DOCKERHUB_USER обязателен}/menu-frontend:${IMAGE_TAG:-latest}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - backend
    networks:
      - edge
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *logging

volumes:
  db_data:
  photos_data:
  caddy_data:
  caddy_config:
  otel_logs:

networks:
  edge:
  internal:
