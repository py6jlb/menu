name: release-gate

# ВЫКЛЮЧЕНО: автоматические запуски (push/PR/теги) отключены — сборка и
# публикация выполняются локально теми же скриптами (scripts/release-gate.sh,
# deploy/build-push.sh). Оставлен ручной запуск: Actions → release-gate →
# Run workflow. Чтобы вернуть авто-гейт, верните блоки push/pull_request.

on:
  workflow_dispatch:

jobs:
  gate:
    name: Гейт (быстрые этапы)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release gate
        run: scripts/release-gate.sh
      - name: Диагностика гейта
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-artifacts
          path: deploy/gate-artifacts/
          if-no-files-found: ignore

  publish:
    name: Сборка и публикация релиза
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Вход в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Сборка, browser smoke и публикация после гейта
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: ./deploy/build-push.sh --publish
      - name: Диагностика релиза
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-artifacts
          path: deploy/gate-artifacts/
          if-no-files-found: ignore
